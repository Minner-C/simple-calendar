# SimpleCalendar 后台站点配置（宝塔：网站 → 站点设置 → 配置文件）
# 替换前确认两处：
#   1. root 路径改成实际的站点根目录
#   2. php-cgi-83.sock 的 83 改成实际安装的 PHP 版本（ls /tmp/php-cgi-*.sock 查看）

server {
    listen 80;
    server_name shizhong.otbest.cn;
    root /www/wwwroot/shizhong.otbest.cn;
    index index.php index.html;

    # 日志
    access_log  /www/wwwlogs/shizhong.otbest.cn.log;
    error_log   /www/wwwlogs/shizhong.otbest.cn.error.log;

    # 伪静态：非真实文件的路径转发给 index.php 路由（/api/... 就靠这条）
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP 解析
    location ~ \.php$ {
        fastcgi_pass   unix:/tmp/php-cgi-83.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 配置/建库文件禁止外部访问（不影响 PHP 内部 include）
    location ~* /(config\.php|db\.php|install\.sql)$ {
        deny all;
    }

    # 隐藏文件（.htaccess 等）禁止访问
    location ~ /\. {
        deny all;
    }
}
